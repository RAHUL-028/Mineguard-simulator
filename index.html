<!DOCTYPE html>
<html lang="en">
  <head>
    <meta cghharset="utf-8/>
      <title> MineGuard /title>
      <style>
      body { margin: 0 overflow: hidden; background: #111; }
      canvas { display: block;}
      <style>
      <script type="importmap">
    {
     "imports": {
    "three": "https://unpkg.com/three@0.10.0/build.three.module.js",
    ""three/addons/":"https://unpkg.com/three@@0.160.0/example/jsm/"
     }
     }
  </script>
  </head>
  <body>
    <script type= "Module">
      import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// basic scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); // sky color - can change

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 10, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);

// light
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

// ground - simple plane for now
const groundMat = new THREE.MeshStandardMaterial({color: 0x8B7355});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), groundMat);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
